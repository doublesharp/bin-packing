[package]
name = "bin-packing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Cut list optimization, rectangular bin packing, and irregular nesting in safe Rust"
readme = "../../README.md"
documentation = "https://docs.rs/bin-packing"
keywords = [
  "bin-packing",
  "cutting-stock",
  "optimization",
  "packing",
  "algorithms",
]
categories = ["algorithms", "science"]

[dependencies]
geo = { workspace = true, optional = true }
rand.workspace = true
rayon = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true

[features]
default = ["one-d", "two-d", "three-d", "irregular", "parallel"]
irregular = ["dep:geo"]
one-d = []
two-d = []
three-d = ["two-d"]
three-d-preview = ["three-d"]
parallel = ["dep:rayon"]

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
serde_json.workspace = true

[[bench]]
name = "solver_benches"
harness = false
required-features = ["one-d", "two-d", "three-d"]

[lints]
workspace = true

[[example]]
name = "saw_planner"
required-features = ["two-d"]

[[test]]
name = "solver_regressions"
required-features = ["one-d", "two-d", "three-d"]

[[test]]
name = "cut_plan_integration"
required-features = ["one-d", "two-d"]

[[test]]
name = "consolidation_2d"
required-features = ["two-d"]

[[test]]
name = "edge_kerf_relief_2d"
required-features = ["two-d"]

[[test]]
name = "kerf_2d_regressions"
required-features = ["two-d"]

[[example]]
name = "saw_stress"
required-features = ["two-d"]

[[example]]
name = "packing_experiment_bench"
required-features = ["one-d", "two-d", "three-d"]

[[example]]
name = "packingsolver_compare"
required-features = ["one-d", "two-d", "three-d", "irregular"]
