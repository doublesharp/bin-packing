name: CI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
      - "feature/**"
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  DOCS_PLAYWRIGHT_VERSION: "1.56.1"
  DOCS_TYPESCRIPT_VERSION: "5.9.3"
  NODE_VERSION: "22"

jobs:
  rust:
    name: Quality gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install repo quality tools
        uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli,typos-cli

      - name: Run repo quality gate
        run: ./scripts/check-quality.sh

      - name: Check feature combinations and fuzz project
        run: ./scripts/check-features.sh

  node:
    name: Node binding
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.25.0 --activate

      - name: Install dependencies
        run: pnpm --dir bindings/node install --frozen-lockfile

      - name: Build native binding
        run: pnpm --dir bindings/node run build

      - name: Test native binding
        run: pnpm --dir bindings/node test

      - name: Test packed native package
        run: node bindings/test/package-native.cjs

      - name: Run native documentation examples
        run: node bindings/test/docs-examples.cjs native

  wasm:
    name: WebAssembly package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build wasm package
        run: npm --prefix bindings/wasm run build

      - name: Test wasm package
        run: npm --prefix bindings/wasm test

      - name: Test packed WASM entry points
        run: node bindings/test/package-wasm.mjs

      - name: Run WASM documentation examples
        run: node bindings/test/docs-examples.cjs wasm

      - name: Build native package for cross-backend contracts
        run: |
          corepack enable
          corepack prepare pnpm@10.25.0 --activate
          pnpm --dir bindings/node install --frozen-lockfile
          pnpm --dir bindings/node run build

      - name: Install declaration and browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/bin-packing-doc-tools" --no-audit --no-fund --no-package-lock "typescript@$DOCS_TYPESCRIPT_VERSION" "playwright@$DOCS_PLAYWRIGHT_VERSION"
          node "$RUNNER_TEMP/bin-packing-doc-tools/node_modules/playwright/cli.js" install --with-deps chromium --only-shell

      - name: Verify declarations, generated cases and browser APIs
        run: |
          node bindings/test/package-types.mjs "$RUNNER_TEMP/bin-packing-doc-tools/node_modules/typescript/lib/tsc.js"
          node bindings/test/solver-finder.cjs --cases 300
          node bindings/test/package-browser.cjs "$RUNNER_TEMP/bin-packing-doc-tools/node_modules/playwright"

      - name: Upload tested WASM package
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: wasm-dist
          path: bindings/wasm/dist
          if-no-files-found: error

  node-native-release:
    name: Build Node native ${{ matrix.target }}
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Install Rust toolchain
        run: rustup show

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: node-native-${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.25.0 --activate

      - name: Install dependencies
        run: pnpm --dir bindings/node install --frozen-lockfile

      - name: Build native package
        run: pnpm --dir bindings/node exec napi build --platform --release --target ${{ matrix.target }}

      - name: Test native artifact
        run: pnpm --dir bindings/node test

      - name: Upload native loader
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v7
        with:
          name: node-loader
          path: bindings/node/index.js
          if-no-files-found: error

      - name: Upload native artifact
        uses: actions/upload-artifact@v7
        with:
          name: node-native-${{ matrix.target }}
          path: bindings/node/bin-packing.*.node
          if-no-files-found: error

  publish:
    name: Publish crates.io and npm
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs:
      - rust
      - node
      - wasm
      - node-native-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Install Rust toolchain
        run: rustup show

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install publishing npm
        run: npm install --global npm@11.19.1

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.25.0 --activate

      - name: Install Node binding dependencies
        run: pnpm --dir bindings/node install --frozen-lockfile

      - name: Download native artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: node-native-*
          path: bindings/node/artifacts
          merge-multiple: true

      - name: Download native loader
        uses: actions/download-artifact@v8
        with:
          name: node-loader
          path: bindings/node

      - name: Verify tag version
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const releaseTag = process.env.RELEASE_TAG;
          if (!/^v\d+\.\d+\.\d+$/.test(releaseTag)) throw new Error('Expected a stable vMAJOR.MINOR.PATCH release tag');
          const tag = releaseTag.slice(1);
          const rootCargo = fs.readFileSync('Cargo.toml', 'utf8');
          const cargoVersion = rootCargo.match(/^version = "([^"]+)"/m)?.[1];
          const packages = [
            ['workspace Rust package', cargoVersion],
            ['Node package', require('./bindings/node/package.json').version],
            ['WASM package', require('./bindings/wasm/package.json').version],
          ];
          const mismatches = packages.filter(([, version]) => version !== tag);
          if (mismatches.length) {
            for (const [name, version] of mismatches) {
              console.error(`${name} version ${version ?? '<missing>'} does not match tag ${tag}`);
            }
            process.exit(1);
          }
          JS

      - name: Prepare native npm packages
        run: |
          pnpm --dir bindings/node exec napi create-npm-dirs
          pnpm --dir bindings/node exec napi artifacts --output-dir artifacts
          pnpm --dir bindings/node exec napi pre-publish --tag-style npm --no-gh-release --skip-optional-publish

      - name: Verify prepared native package
        run: node bindings/test/package-native.cjs --release

      - name: Download tested WASM package
        uses: actions/download-artifact@v8
        with:
          name: wasm-dist
          path: bindings/wasm/dist

      - name: Verify prepared WASM package
        run: node bindings/test/package-wasm.mjs

      - name: Verify publishable Rust crate
        run: cargo publish -p bin-packing --locked --dry-run

      - name: Publish native npm packages
        run: |
          for dir in bindings/node/npm/*/; do
            npm publish "$dir" --access public --provenance
          done

      - name: Publish Node wrapper package
        run: npm publish --access public --provenance
        working-directory: bindings/node

      - name: Publish Rust crate
        run: cargo publish -p bin-packing --locked

      - name: Publish WASM package
        run: npm publish --ignore-scripts --access public --provenance
        working-directory: bindings/wasm

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: docs/releases/${{ env.RELEASE_TAG }}.md
          generate_release_notes: true
